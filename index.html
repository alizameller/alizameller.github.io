<!-- HTML file for content --> 

<!-- use 'html:5' for template code -->
<!DOCTYPE html> <!-- this line indicates that this file contains HTML5 code-->
<html lang="en">
<head>
    <!-- <meta > indicates metadata information that won't be visible to the viewer unless 
        they view the source code -->
    <!-- meta elements provide descriptive info about the webpage (ex: info to return in 
        search results) -->
    <meta charset="UTF-8"> <!-- helpful for security purposes -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aliza Meller</title> <!-- appears at the top of the browser window -->
    <link rel="stylesheet" href="main.css"> <!-- link to external CSS stylsheet -->
</head>
<body class="light-theme"> <!-- body contains content that is visible to the user -->
    <img src="logo.gif" alt="Logo Gif" style="width:200px;height:48px;">
    <!--<h1>Aliza Meller</h1>-->
    <p id="msg">About Me</p> <!-- "id" styles one element -->
    <ul id="projects">
        <li>LED Matrix</li> 
        <li>Theremin</li>
        <li>Countertop Crops</li>
        <li>Motion Activated Music Player</li>
    </ul>
    <div>
        <button class="btn">Dark</button> <!-- "class" styles all elements in same class-->
    </div>
    <!-- load app.js -->
    <script src="app.js"></script> <!-- this goes at the end of a section so that all the page 
    content will display on the screen first, and then the script will be loaded -->
    <noscript>You need to enable JavaScript to view the full site.</noscript> <!-- noscript 
    shows a message if JavaScript is deactivated (this is an ex of fault tolerance) -->
</body>
</html>
